name: wolfHAL STM32H563ZI Nucleo Build

on:
  push:
    branches: [ 'master', 'main', 'release/**' ]
  pull_request:
    branches: [ '*' ]

jobs:
  wolfhal_stm32h563zi_nucleo_build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # wolfHAL comes from the lib/wolfHAL submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install ARM toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build STM32H563 port with the wolfHAL driver backend
        run: |
          set -euo pipefail
          make -C src/port/stm32h563 ENABLE_WOLFHAL=1 BOARD=stm32h563zi_nucleo \
            CC=arm-none-eabi-gcc OBJCOPY=arm-none-eabi-objcopy

      - name: Verify binary
        run: |
          set -euo pipefail
          test -f src/port/stm32h563/app.bin
          arm-none-eabi-size src/port/stm32h563/app.elf

  wolfhal_stm32h563zi_nucleo_m33mu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-m33mu:latest
      options: --privileged

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: DHCP + TCP echo under m33mu with the wolfHAL driver backend
        run: /bin/bash tools/scripts/run-m33mu-ci-in-container.sh stm32h563-m33mu-wolfhal stm32h563_m33mu_echo_wolfhal

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wolfhal-m33mu-logs
          path: |
            /tmp/m33mu.log
            /tmp/echo.pcap
            /tmp/echo.log
          if-no-files-found: ignore
